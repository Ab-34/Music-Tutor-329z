[project]
name = "music-tutor"
version = "0.1.0"
description = "Agentic music tutor: transcribe, assess, remember, simplify (CS329Z project)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Audio path: transcription + synthesis + self-check. Needs `brew install fluid-synth`.
audio = [
    "basic-pitch>=0.4",
    "pyfluidsynth>=1.3",
    "librosa>=0.10",
    "soundfile>=0.12",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tutor*"]
